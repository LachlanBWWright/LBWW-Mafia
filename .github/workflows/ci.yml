name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

permissions:
  contents: read

jobs:
  server-test:
    name: Server — lint, typecheck, test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir server run lint
      - run: pnpm --dir server run typecheck
      - run: pnpm --dir server run test:coverage
      - run: cargo test --locked --manifest-path rust/Cargo.toml --workspace
      - run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      - run: cargo clippy --locked --manifest-path rust/Cargo.toml --workspace --all-targets -- -D warnings
      - run: cargo install cargo-llvm-cov --version 0.6.21 --locked
      - run: cargo llvm-cov --locked --manifest-path rust/Cargo.toml -p game-core --summary-only --fail-under-lines 85 --fail-under-functions 90
      - run: pnpm run test:next-rust:smoke

  nextjs-test:
    name: Next.js — lint, typecheck, test, build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      AUTH_SECRET: ci-dummy-secret
      AUTH_GOOGLE_ID: ci-dummy
      AUTH_GOOGLE_SECRET: ci-dummy
      DATABASE_URL: file:./dev.db
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir nextjs run lint
      - run: pnpm --dir nextjs run typecheck
      - run: pnpm --dir nextjs run test
      - run: pnpm --dir nextjs run build
