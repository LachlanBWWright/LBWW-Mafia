name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

permissions:
  contents: read

jobs:
  server-test:
    name: Server — lint, typecheck, test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install
      - run: pnpm --dir server run lint
      - run: pnpm --dir server run typecheck
      - run: pnpm --dir server run test

  nextjs-test:
    name: Next.js — lint, typecheck, test, build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      AUTH_SECRET: ci-dummy-secret
      AUTH_GOOGLE_ID: ci-dummy
      AUTH_GOOGLE_SECRET: ci-dummy
      DATABASE_URL: file:./dev.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install
      - run: pnpm --dir nextjs run lint
      - run: pnpm --dir nextjs run typecheck
      - run: pnpm --dir nextjs run test
      - run: pnpm --dir nextjs run build
