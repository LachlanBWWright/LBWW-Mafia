[workspace]
members = ["game-core", "game-server"]
resolver = "2"

[workspace.lints.rust]
unconditional_panic = "deny"

[workspace.lints.clippy]
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
string_slice = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
